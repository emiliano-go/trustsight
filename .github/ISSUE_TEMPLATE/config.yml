# Blank issues are disabled so a report lands on a template; a security
# vulnerability must never arrive as an open public issue.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability (private)
    url: https://github.com/emiliano-go/trustsight/blob/master/docs/security.md#how-to-report
    about: >
      Code execution, an unexpected network host, terminal-escape injection, a
      resource-exhaustion crash, or an integrity breach. Do NOT open a public
      issue. Email emiliano.gandini@protonmail.com (PGP F759D6D49B0A395AB922414A5CC3B4C50D37E793).
  - name: What TrustSight cannot see
    url: https://github.com/emiliano-go/trustsight/blob/master/docs/explanation/what-trustsight-cannot-see.md
    about: >
      Before filing a missed detection, check the documented limits. "It missed
      a compromised upstream tarball" is a known ceiling, not a defect.
  - name: Tuning False Positives
    url: https://docs.trustsight.org/guides/tuning-false-positives/
    about: >
      Read the difference between a benign false positive (a real finding about
      a bad packager practice) and a malicious false positive (a bad rule
      trigger) before reporting.
  - name: Report a false positive
    url: https://github.com/emiliano-go/trustsight/issues/new?template=false_positive.yml
    about: >
      A rule fired with no bad practice or malicious behavior behind it. For a
      real finding about a bad packager practice, use the tuning guide instead.
  - name: Documentation
    url: https://github.com/emiliano-go/trustsight/tree/master/docs
    about: CLI reference, rules, configuration, and the security model.
