name: False positive
description: A rule fired on an update and you think the trigger is wrong. Read the two-kind distinction before filing.
title: "[False positive]: "
labels: ["false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        TrustSight's rules are calibrated, and false-positive tuning is ongoing.

        **Two different things get called a false positive.** A *bad rule
        trigger* is the only one this tracker can tune. A *real finding about a
        packager practice* is not a rule bug: the rule correctly found something
        undesirable, and the fix belongs with the packager or in the documented
        known false positives. The definitions and examples are in
        [Tuning False Positives](https://docs.trustsight.org/guides/tuning-false-positives/#two-kinds-of-false-positive).

        If this is a security issue (code execution, an unexpected network
        host, or an integrity breach), report it privately instead:
        [How to report](https://docs.trustsight.org/security/#how-to-report).
  - type: dropdown
    id: kind
    attributes:
      label: What kind of report is this?
      description: Pick "Not sure" if you cannot tell. A maintainer will classify it.
      options:
        - Bad rule trigger (malicious false positive)
        - Correct finding, wrong weight or severity (overweighted)
        - Real finding about a packager practice (benign false positive)
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I checked the documented known false positives and this is not one of them.
          required: true
        - label: This is not a private security report.
          required: true
  - type: input
    id: version
    attributes:
      label: TrustSight version
      description: Output of `trustsight --version`, or the analyzer version shown on the feed.
      placeholder: "trustsight 0.22.0"
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: AUR package
      description: The package name the finding is about.
      placeholder: "some-package"
    validations:
      required: true
  - type: input
    id: alert_url
    attributes:
      label: Feed alert URL
      description: "Optional, but the exact alert lets the triage agent fetch the same evidence. Example: https://watcher.trustsight.org/2026-10-23/110000/"
      placeholder: "https://watcher.trustsight.org/2026-10-23/110000/"
    validations:
      required: false
  - type: input
    id: rule_id
    attributes:
      label: Rule id
      description: The rule or rules that fired, for example R007 or H015. Copy them from the finding.
      placeholder: "R007"
    validations:
      required: true
  - type: textarea
    id: reported
    attributes:
      label: What TrustSight reported
      description: >
        The score, verdict, rule ids, and the exact finding text. Paste
        `trustsight inspect <pkg> --json`, or run
        `trustsight inspect <pkg> --fp-template` to generate this body and the
        issue link. From the feed, use "Copy FP report".
      render: json
    validations:
      required: true
  - type: textarea
    id: why-benign
    attributes:
      label: Why this is a bad rule trigger
      description: What the rule misread, and why there is no bad practice or malicious behavior behind it. This is the key field.
    validations:
      required: true
  - type: textarea
    id: pkgbuild
    attributes:
      label: PKGBUILD or diff
      description: The recipe or diff that triggered the finding. This is the single most useful artifact.
      render: shell
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or mode
      description: "For example `trustsight review`, `trustsight inspect`, `trustsight lint`, or the watcher."
      placeholder: "trustsight inspect some-package"
    validations:
      required: false
  - type: input
    id: config_fingerprint
    attributes:
      label: Config fingerprint
      description: The `config_fingerprint` value from the JSON report, when you have it.
    validations:
      required: false
