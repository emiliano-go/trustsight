name: Calibration Gates

# The §10 gates on every push: the test suite runs them on a sample so a
# full corpus replay stays out of local `pytest`, and this job runs them
# whole.  A rule drifting into noise, an annotation acquiring weight, or a
# labelled attack going undetected fails here rather than being noticed a
# month later in the drift report.
on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # The corpus is not committed (*.diff is gitignored), so the checkout
      # has no diffs to score.  Rebuild the exact corpus named by the lock,
      # the same way mirror-check and corpus-drift already do, before the
      # gates can run.
      - name: Reconstruct corpus from lock
        run: |
          python scripts/build_corpus.py --from-manifest \
            --manifest tests/fixtures/corpus.lock \
            --out tests/fixtures/benign-corpus

      - name: Run the calibration gates over the whole corpus
        run: python scripts/calibration_gates.py --json gates.json

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calibration-gates
          path: gates.json
