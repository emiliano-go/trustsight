name: Calibration Gates

# The §10 gates on every push: the test suite runs them on a sample so a
# full corpus replay stays out of local `pytest`, and this job runs them
# whole.  A rule drifting into noise, an annotation acquiring weight, or a
# labelled attack going undetected fails here rather than being noticed a
# month later in the drift report.
on: [push, pull_request]

permissions:
  contents: read

# The tag of the channel release carrying baseline-benign-corpus.tar.gz.
# It moves in the same commit as corpus.lock: the asset IS the corpus the
# lock names, packed by scripts/pack_calibration_corpus.py.
env:
  CALIBRATION_CORPUS_TAG: baseline-2026-10-22
  # Shard count.  Keep in sync with the matrix below.  The plan's per-package
  # tasks are independent (each carries its novelty prefix), so the merged
  # shards are byte-identical to a single-process scan.
  CALIBRATION_SHARDS: 4

jobs:
  # The scan is the whole cost of this workflow, so it runs as a matrix:
  # each shard is a separate runner scanning its slice of the plan, and the
  # merge job evaluates every gate over the concatenated rows.
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked --extra dev --python 3.12

      # The corpus is not committed (*.diff is gitignored), and rebuilding it
      # from corpus.lock is not byte-stable across git versions: the same lock
      # reconstructed to different bytes here than on the machine the figures
      # were measured on, and the few differing diffs moved the benign flag
      # rate (7.8 vs 7.9).  So the corpus is downloaded as a packed asset and
      # the extracted bytes are verified against baseline.json.
      - name: Fetch the calibration corpus
        run: |
          curl -fL --retry 3 -o /tmp/baseline-benign-corpus.tar.gz \
            "https://github.com/emiliano-go/trustsight/releases/download/${CALIBRATION_CORPUS_TAG}/baseline-benign-corpus.tar.gz"
          mkdir -p tests/fixtures/benign-corpus
          tar -xzf /tmp/baseline-benign-corpus.tar.gz -C tests/fixtures/benign-corpus
          uv run python scripts/pack_calibration_corpus.py --check
          uv run python scripts/corpus_provenance.py --corpus tests/fixtures/benign-corpus

      - name: Scan shard ${{ matrix.shard }} of ${{ env.CALIBRATION_SHARDS }}
        run: >-
          uv run python scripts/calibration_gates.py
          --shard ${{ matrix.shard }}/${{ env.CALIBRATION_SHARDS }}
          --shard-rows shard-${{ matrix.shard }}.json

      - name: Upload shard rows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json

  gates:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The published-figures check runs pytest, and `tests/test_pkgbuild.py`
          # ties the PKGBUILD checksum to a tag, so the checkout must carry tags.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked --extra dev --python 3.12

      - name: Fetch the calibration corpus
        run: |
          curl -fL --retry 3 -o /tmp/baseline-benign-corpus.tar.gz \
            "https://github.com/emiliano-go/trustsight/releases/download/${CALIBRATION_CORPUS_TAG}/baseline-benign-corpus.tar.gz"
          mkdir -p tests/fixtures/benign-corpus
          tar -xzf /tmp/baseline-benign-corpus.tar.gz -C tests/fixtures/benign-corpus
          uv run python scripts/pack_calibration_corpus.py --check

      - name: Download the shard rows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scan-shard-*
          path: scan-shards
          merge-multiple: true

      - name: Run the calibration gates over the whole corpus
        run: >-
          uv run python scripts/calibration_gates.py
          --merge-dir scan-shards
          --json gates.json
          --rows scan-rows.json

      # The coverage ledger is built from the same shard rows: no second
      # corpus replay.  It accounts for every catalog id and is uploaded with
      # the gate results so a stratum that moved nothing is visible.
      - name: Build the coverage ledger
        run: >-
          uv run python scripts/coverage_ledger.py
          --rows scan-rows.json
          --out coverage-ledger.json

      - name: Audit provenance of the reconstructed corpus
        run: uv run python scripts/corpus_provenance.py --corpus tests/fixtures/benign-corpus

      # Addendum 3 Phase 5: the H-series overlap/zero-fire audit.  Reporting
      # only: it measures the co-fire matrix and the zero-fire ledger the
      # merger decision is adjudicated from; it never retires an id.
      - name: Audit H-series overlap and zero-fire (reporting)
        run: uv run python scripts/h_reduction_audit.py --json h-reduction-audit.json --rows scan-rows.json

      # The typed diff core's projection lock: every diff's parse is checked
      # against the committed baseline, so a change that moves file
      # attribution, a side, a line number or hunk arithmetic fails until
      # the baseline is deliberately regenerated.  The default suite runs a
      # sample; here it runs whole.
      # The E-series ships its thresholds empty; this measures the corpus
      # distributions and prints the suggested floors (Q3 auto-calibration),
      # as an artifact for the next deliberate calibration commit.  Reporting
      # only: it never rewrites the shipped defaults.
      - name: Measure the entropy thresholds (reporting)
        run: uv run python scripts/entropy_calibrate.py --json entropy-thresholds.json

      - name: Check the diffdoc projection baseline over the whole corpus
        run: uv run python tests/harness/diffdoc_parity.py --check tests/fixtures/diffdoc-projections.json.gz

      # The ChangeDelta parity lock (spec §1): every diff's ChangeDelta is
      # checked to reproduce the host/checksum/local-source facts the change
      # summary reads, so a migration cannot make one surface re-derive a
      # fact differently.  The default suite runs a sample; here it runs
      # whole.
      - name: Check ChangeDelta parity over the whole corpus
        run: uv run python tests/harness/change_parity.py

      # Addendum 3: the history-exercising corpus (the observation-history
      # rules the stateless corpus never fires).  A drift in H026/H044,
      # H045/H073, H052/H053/H055/H059/H073/H074 fails here.
      - name: Replay the history-exercising corpus
        run: uv run python tests/harness/history_replay.py --json history-replay.json

      # The published suite size is measured with the corpus present (one
      # module parametrizes over its diffs), so it is checked here rather
      # than in the matrix job, which has no corpus to build.
      - name: Verify the published figures
        # This is the only job that measures the exact suite size: the
        # collected set depends on the environment and the corpus, so the
        # test asserts it only when this flag is set.
        env:
          TRUSTSIGHT_PUBLISHED_FIGURES_STRICT: "1"
        run: uv run --extra dev pytest tests/test_published_figures.py -q

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calibration-gates
          path: |
            gates.json
            h-reduction-audit.json
            history-replay.json
            coverage-ledger.json
