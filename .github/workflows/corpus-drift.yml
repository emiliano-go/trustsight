name: Corpus Drift Detection
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

# The tag of the channel release carrying baseline-benign-corpus.tar.gz.
# It moves in the same commit as corpus.lock: the asset IS the corpus the
# lock names, packed by scripts/pack_calibration_corpus.py.  The same env
# as calibration.yml, because both jobs must measure the same bytes.
env:
  CALIBRATION_CORPUS_TAG: baseline-2026-09-24

permissions:
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --locked --extra dev --python 3.12

      # The corpus is the packed release asset, not a rebuild from the
      # lock: `git diff -W` output is not byte-stable across git versions,
      # so a reconstruction here produced a different corpus than the one
      # baseline.json was measured on, and the hash and a few rates drifted
      # on every run.  That filed an issue every month regardless of rule
      # drift.  calibration.yml downloads the same asset and verifies the
      # extracted bytes against baseline.json; this job now does too, so a
      # reported drift is a rule change and not a runner difference.
      - name: Fetch the calibration corpus
        run: |
          curl -fL --retry 3 -o /tmp/baseline-benign-corpus.tar.gz \
            "https://github.com/emiliano-go/trustsight/releases/download/${CALIBRATION_CORPUS_TAG}/baseline-benign-corpus.tar.gz"
          mkdir -p tests/fixtures/benign-corpus
          tar -xzf /tmp/baseline-benign-corpus.tar.gz -C tests/fixtures/benign-corpus
          uv run python scripts/pack_calibration_corpus.py --check

      - name: Compute current baseline
        run: |
          uv run python scripts/rebaseline.py \
            --corpus tests/fixtures/benign-corpus \
            --manifest tests/fixtures/corpus.lock \
            --baseline /tmp/baseline-current.json

      - name: Compare with stored baseline
        id: diff
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path

          # `generated` and `pipeline_version` describe when and with what
          # the file was written, not what it measures.  A monthly rebuild
          # necessarily restamps them, so comparing them would file a drift
          # issue every month regardless of the fire rates.
          IGNORED = ("generated", "pipeline_version")

          def norm(p):
              data = json.loads(Path(p).read_text())
              for key in IGNORED:
                  data.pop(key, None)
              return json.dumps(data, sort_keys=True,
                                indent=2).splitlines(keepends=True)

          import difflib
          delta = "".join(difflib.unified_diff(
              norm("tests/fixtures/baseline.json"),
              norm("/tmp/baseline-current.json"),
              fromfile="baseline.json", tofile="rebuilt",
          ))

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"drift={'yes' if delta else 'no'}\n")

          # Written to a file, not to an output: a heredoc delimiter can be
          # forged by diff content, and the payload can exceed the 1 MB
          # output limit on a wide rule change.
          Path("/tmp/drift.txt").write_text(delta)
          print(delta[:20000] or "No drift detected.")

      - name: Raise issue on drift
        if: steps.diff.outputs.drift == 'yes'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            let changes = fs.readFileSync('/tmp/drift.txt', 'utf8');
            const LIMIT = 50000;
            if (changes.length > LIMIT) {
              changes = changes.slice(0, LIMIT) + '\n... truncated, see run log ...';
            }
            const body = [
              'Monthly re-baseline detected changes in FP rates.',
              '',
              '```diff',
              changes,
              '```',
              '',
              'If the change is expected, refresh the baseline:',
              '',
              '```',
              'python scripts/rebaseline.py',
              '```',
              '',
              'Materialise the corpus first if it is absent (it is not committed);',
              'see docs/contributing/re-baselining.md.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const title = 'Corpus baseline drift detected';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'corpus-drift',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue already open, not filing a duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['corpus-drift'],
            });
