name: Docker image

# Publishes the GHCR image for a release.  `release: published` only fires
# when a human publishes through the UI: the release workflow publishes with
# GITHUB_TOKEN, and token-triggered events never cascade into workflow runs.
# `workflow_run` is the chain that does fire after a successful release.
# `workflow_dispatch` rebuilds an existing tag by hand.
on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release software"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.17.1
        required: true
        type: string

# Least privilege at the top level; the push job grants itself
# `packages: write`.
permissions:
  contents: read

jobs:
  publish:
    name: Build, smoke test, and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'release' ||
       startsWith(github.event.release.tag_name, 'v'))
    steps:
      - name: Resolve the image version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          # This step runs before checkout, so `gh` has no local repository
          # to infer; without GH_REPO it exits "not a git repository".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          # A workflow_run carries no release reference; the release the
          # triggering run just published is the newest v* release.
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release list --limit 20 --json tagName \
              --jq '[.[].tagName | select(startswith("v"))][0]')"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not a software release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Guard against pre-Dockerfile tags
        run: |
          # A tag cut before the Dockerfile existed cannot produce an image
          # of itself; say so rather than failing inside buildx.
          if [[ ! -f Dockerfile ]]; then
            echo "::error::${{ steps.meta.outputs.tag }} predates the Dockerfile; the image stream starts with the next release"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The parser workers need an unprivileged user namespace inside the
      # container, so enable it on the host.  The smoke runs use the shipped
      # watcher seccomp profile and Docker's AppArmor profile, not unconfined.
      - uses: ./.github/actions/enable-userns

      # The image is exercised before it can be pushed: `--version` proves
      # the interpreter and the entrypoint, `lint-rules` exercises the rule
      # corpus without touching the network.
      - name: Build the image
        run: |
          docker build -t "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}" .
          docker run --rm --security-opt seccomp="$PWD/docker/seccomp-watcher.json" --security-opt apparmor=docker-default "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}" --version
          docker run --rm --security-opt seccomp="$PWD/docker/seccomp-watcher.json" --security-opt apparmor=docker-default "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}" lint-rules

      # The parser/tokenizer sandbox is exercised under the same seccomp and
      # read-only root the watcher uses, not only the rule-corpus commands.
      - name: Exercise the parser under the shipped profile
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          {
            echo 'pkgname=lint-fixture'
            echo 'pkgver=1.0'
            echo 'pkgrel=1'
            echo "arch=('any')"
            echo 'package() {'
            echo '  install -Dm644 /dev/null "$pkgdir/usr/share/lint-fixture"'
            echo '}'
          } >"$RUNNER_TEMP/PKGBUILD"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /home/ts/.cache:size=64m,noexec,nosuid,nodev \
            --tmpfs /home/ts/.config:size=8m \
            --user 1000:1000 --cap-drop=all \
            --security-opt=no-new-privileges \
            --security-opt=seccomp="$PWD/docker/seccomp-watcher.json" \
            --security-opt=apparmor=docker-default \
            -v "$RUNNER_TEMP:/work:ro" \
            "$image" lint /work/PKGBUILD --json >"$RUNNER_TEMP/lint.json"
          grep -q 'lint-fixture' "$RUNNER_TEMP/lint.json"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /home/ts/.cache:size=64m,noexec,nosuid,nodev \
            --user 1000:1000 --cap-drop=all \
            --security-opt=no-new-privileges \
            --security-opt=seccomp="$PWD/docker/seccomp-watcher.json" \
            --security-opt=apparmor=docker-default \
            -e TRUSTSIGHT_CONFIG_DIR=/tmp \
            -e PYTHONPATH=/app/src \
            --entrypoint /app/.venv/bin/python \
            "$image" -c 'from trustsight.analysis.manifests import parse_manifest; print(parse_manifest("package.json", "{\"dependencies\":{\"left-pad\":\"1.0.0\"}}"))' \
            >"$RUNNER_TEMP/manifest.json"
          grep -q 'left-pad' "$RUNNER_TEMP/manifest.json"

      # The proxy is threaded; the strict fetcher profile must return ENOSYS
      # for clone3 so glibc falls back to clone. A denied host proves both
      # startup under that profile and the allowlist response.
      - name: Exercise the egress proxy under the fetcher profile
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          name="ts-proxy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" --read-only \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev \
            --tmpfs /home/ts/.cache:size=16m,noexec,nosuid,nodev \
            --cap-drop=all --security-opt=no-new-privileges \
            --security-opt=seccomp="$PWD/docker/seccomp-fetcher.json" \
            --user 1000:1000 "$image" egress-proxy --listen 127.0.0.1:3128
          docker exec "$name" /app/.venv/bin/python -c \
            'import socket; s=socket.create_connection(("127.0.0.1",3128),5); s.sendall(b"CONNECT example.com:443 HTTP/1.1\r\nHost: example.com:443\r\n\r\n"); print(s.recv(200).decode())' \
            | grep -q '403'

      - name: Exercise the token broker under the fetcher profile
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          name="ts-broker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUNNER_TEMP/tokens"
          printf 'tok-ci\n' >"$RUNNER_TEMP/tokens/github.token"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" --read-only \
            --tmpfs /run/trustsight:size=8m \
            --tmpfs /tmp:size=8m,noexec,nosuid,nodev \
            --cap-drop=all --security-opt=no-new-privileges \
            --security-opt=seccomp="$PWD/docker/seccomp-fetcher.json" \
            --user 1000:1000 \
            -v "$RUNNER_TEMP/tokens:/tokens:ro" \
            --entrypoint /app/.venv/bin/trustsight "$image" \
            token-broker --socket /run/trustsight/token.sock \
              --token-dir /tokens
          docker exec "$name" /app/.venv/bin/python -c \
            'import socket; s=socket.socket(socket.AF_UNIX); s.connect("/run/trustsight/token.sock"); s.sendall(b"{\"provider\":\"github\"}\n"); print(s.recv(4096).decode())' \
            | grep -q 'tok-ci'

      - name: Start the auxiliary compose topology
        run: |
          set -eu
          export TRUSTSIGHT_IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          export TRUSTSIGHT_PROXY_TOKEN="compose-ci"
          mkdir -p run/trustsight run/trustsight-token
          cleanup() {
            docker compose -f docker-compose.watcher.yml down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose -f docker-compose.watcher.yml \
            up -d egress-proxy token-broker feed-signer
          sleep 3
          running="$(docker compose -f docker-compose.watcher.yml ps --status running --services)"
          for service in egress-proxy token-broker feed-signer; do
            echo "$running" | grep -qx "$service"
          done

      - name: Exercise the feed signer under the fetcher profile
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
          name="ts-signer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key="$(openssl genpkey -algorithm ED25519 2>/dev/null \
            | openssl pkcs8 -topk8 -nocrypt -outform DER \
            | base64 -w0)"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" --read-only \
            --tmpfs /run/trustsight:size=8m \
            --tmpfs /audit:size=8m \
            --tmpfs /tmp:size=8m,noexec,nosuid,nodev \
            --cap-drop=all --security-opt=no-new-privileges \
            --security-opt=seccomp="$PWD/docker/seccomp-fetcher.json" \
            --user 1000:1000 \
            -e "TRUSTSIGHT_FEED_KEY=$key" -e TRUSTSIGHT_FEED_KEY_ID=ci \
            --entrypoint /app/.venv/bin/trustsight "$image" \
            feed-signer --socket /run/trustsight/feed-signer.sock \
              --audit-log /audit/log.json --audit-head /audit/head.json
          docker exec "$name" /app/.venv/bin/python -c \
            'import base64,json,socket; body=json.dumps({"event":"trustsight.heartbeat","scans":[]}).encode(); req=json.dumps({"body":base64.b64encode(body).decode(),"webhook_id":"ci"}).encode()+b"\n"; s=socket.socket(socket.AF_UNIX); s.connect("/run/trustsight/feed-signer.sock"); s.sendall(req); print(s.recv(4096).decode())' \
            | grep -q '"ok": true'
          docker exec "$name" /bin/cat /audit/head.json | grep -q chain_sha256

      # The read-only recipe in docs/workflows/reducing-blast-radius.md.  Two
      # passes against the same volumes: a recreated container must stay
      # writable with the state the first run wrote, and a change to the image
      # UID or required paths must fail here before the image is published.
      # The shipped seccomp profile allows the parser namespace floor; the
      # workers still apply their own seccomp allowlist and namespace floor.
      - name: Exercise the documented isolated container
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data="ts-smoke-data-${suffix}"
          config="ts-smoke-config-${suffix}"
          for volume in "$data" "$config"; do
            docker volume create "$volume" >/dev/null
          done
          cleanup() {
            for volume in "$data" "$config"; do
              docker volume rm "$volume" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          run_ts() {
            docker run --rm --read-only \
              --tmpfs /tmp:rw,size=64m,mode=1777 \
              --tmpfs /home/ts/.cache:size=64m \
              --user 1000:1000 \
              --cap-drop=all \
              --security-opt=no-new-privileges \
              --security-opt=seccomp="${PWD}/docker/seccomp-watcher.json" \
              --security-opt=apparmor=docker-default \
              --pids-limit=512 --memory=2g --cpus=2 \
              -e TRUSTSIGHT_OFFLINE=1 \
              -e TRUSTSIGHT_NO_UPDATE_CHECK=1 \
              -v "$data:/home/ts/.local/share/trustsight" \
              -v "$config:/home/ts/.config/trustsight" \
              "$image" "$@"
          }

          for pass in 1 2; do
            run_ts status --json >/dev/null
            run_ts db check --json >/dev/null
            run_ts lint-rules --json >/dev/null
          done

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          # `latest` tracks stable releases only; a prerelease must not move it.
          if [ "${{ steps.meta.outputs.prerelease }}" != "true" ]; then
            docker tag "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" "ghcr.io/${GITHUB_REPOSITORY}:latest"
            docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
