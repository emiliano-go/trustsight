name: Docker image

# Publishes the GHCR image for a release.  The `release: published` event
# only fires once the release workflow has finished its verification and
# flipped the draft public, so the image can never precede the artifacts it
# packages.  `workflow_dispatch` rebuilds an existing tag by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.17.0
        required: true
        type: string

# Least privilege at the top level; the push job grants itself
# `packages: write`.
permissions:
  contents: read

jobs:
  publish:
    name: Build, smoke test, and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve the image version
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || 'false' }}
        run: |
          set -eu
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not a software release tag"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          # A tag cut before the Dockerfile existed cannot produce an image
          # of itself; say so rather than failing inside buildx.
          if [[ ! -f Dockerfile ]]; then
            echo "::error::tag $TAG predates the Dockerfile; the image stream starts with the next release"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The image is exercised before it can be pushed: `--version` proves
      # the interpreter and the entrypoint, `lint-rules` exercises the rule
      # corpus without touching the network.
      - name: Build the image
        run: |
          docker build -t "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}" .
          docker run --rm "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}" --version
          docker run --rm "ghcr.io/${GITHUB_REPOSITORY}:${{ steps.meta.outputs.version }}" lint-rules

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          # `latest` tracks stable releases only; a prerelease must not move it.
          if [ "${{ steps.meta.outputs.prerelease }}" != "true" ]; then
            docker tag "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}" "ghcr.io/${GITHUB_REPOSITORY}:latest"
            docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
