name: FP evidence

# Maintainer-triggered evidence gathering for a false-positive issue.  The
# alert slug comes from the issue form.  This never runs from an untrusted
# issue event, so it cannot be used to make the runner fetch arbitrary pages.

on:
  workflow_dispatch:
    inputs:
      alert_slug:
        description: "Feed alert slug, for example 2026-10-23/120000"
        required: true

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trustsight
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: emiliano-go/trustsight-harness
          path: trustsight-harness
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Gather evidence
        working-directory: trustsight-harness
        env:
          ALERT_SLUG: ${{ inputs.alert_slug }}
        run: |
          uv sync --locked
          uv run python -m harness fp_triage \
            --alert-slug "$ALERT_SLUG" --out fp-evidence.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fp-evidence
          path: trustsight-harness/fp-evidence.json
          if-no-files-found: warn
