name: Harness regression

# The harness repo gates its own pushes by replaying every committed bypass
# against the TrustSight commit it pins.  This job closes the other
# direction: a change on this repo is measured against the harness corpus on
# the push that makes it, and a regression fails the check.
#
# The harness command's own exit code says "the run happened", never "the
# numbers are good" (see its docs/reference/exit-codes), so this job reads the
# report and judges it: open, degraded or unreplayable above the committed
# baseline fails.  It is a required check, so it runs on every push and pull
# request rather than only on source changes - a required check that does not
# report would block every merge it does not apply to.
#
# A version mismatch is a hard failure too: the harness clone cannot measure
# this checkout at all, which is a configuration fault, and a check that
# passed because it could not measure would read as the guarantee it is not.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # actions/checkout refuses a path outside $GITHUB_WORKSPACE, and the
      # harness resolves its local TrustSight source as `../trustsight`, so
      # clone it as this checkout's sibling - the same layout the harness's
      # own CI uses, mirrored.
      #
      # Pinned to a commit, not a branch: the job runs external code inside
      # the run that certifies this build, so it measures a fixed harness
      # rather than whatever the default branch holds at push time.  Bump the
      # SHA in the same commit that moves the harness pin to a new release.
      - name: Clone the harness
        run: |
          git init ../trustsight-harness
          git -C ../trustsight-harness remote add origin https://github.com/emiliano-go/trustsight-harness.git
          git -C ../trustsight-harness fetch --depth 1 origin 07809f1afca5e5880ae50c8f29dc1dba062b2805
          git -C ../trustsight-harness checkout --detach FETCH_HEAD

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: The harness declares this core version
        # `Environment.resolve` refuses a run whose declared version is not
        # the installed one, and the harness lockfile is version-coupled.  A
        # mismatch means the harness pin and campaigns have not been moved to
        # this release yet; that is a config fault, not a measurement.
        run: |
          core=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          declared=$(sed -n 's/^trustsight_version:[[:space:]]*"\?\([^"]*\)"\?.*/\1/p' ../trustsight-harness/defaults/environment.yml)
          echo "core=$core harness=$declared"
          test "$core" = "$declared" || {
            echo "the harness declares $declared, this checkout is $core; move the harness pin and campaigns before this job can measure the change" >&2
            exit 1
          }

      - name: Baseline before the run
        # The harness' committed report is the baseline the gate judges
        # against.
        run: cp ../trustsight-harness/regression/report.json baseline-report.json

      # The harness's committed lock already names this core version as an
      # editable path dependency, so `--locked` is enough and no resolver
      # runs here: an unpinned `uv lock` would add a live PyPI resolve to the
      # job that certifies the security model (see docs/security.md).
      - name: Sync the harness against this checkout
        run: |
          cd ../trustsight-harness
          uv sync --locked --all-extras

      - name: Replay every committed bypass
        # `shell: bash` is not cosmetic: GitHub's explicit bash shell enables
        # `-eo pipefail`, so a harness that exits nonzero fails this step even
        # through the `| tee`.  The default `bash -e` has no pipefail, which
        # would mask the failure and let the gate pass without measuring.
        shell: bash
        run: |
          cd ../trustsight-harness
          uv run python -m harness regression --jobs auto | tee regression-summary.txt

      - name: Report
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          report = json.load(open("../trustsight-harness/regression/report.json"))
          baseline = json.load(open("baseline-report.json"))
          print("### Harness regression\n")
          print("| field | baseline | this run |")
          print("|---|---|---|")
          for field in ("total", "closed", "open", "degraded", "unreplayable"):
              print(f"| {field} | {baseline[field]} | {report[field]} |")
          regressed = [f for f in ("open", "degraded", "unreplayable")
                       if report[f] > baseline[f]]
          if regressed:
              print("\n**Regression: " + ", ".join(
                  f"{f} {baseline[f]} -> {report[f]}" for f in regressed) + ".**")
          else:
              print("\nNo regression against the committed baseline.")
          PY

      - name: Collect the report
        if: always()
        run: |
          mkdir -p harness-report
          cp ../trustsight-harness/regression/report.json harness-report/
          cp ../trustsight-harness/regression-summary.txt harness-report/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: harness-regression-report
          path: harness-report/

      - name: Fail on regression
        # The harness exit code only says the replay happened; this is where a
        # widened regression surface becomes a failed check.
        run: |
          python3 - <<'PY'
          import json
          import sys

          report = json.load(open("../trustsight-harness/regression/report.json"))
          baseline = json.load(open("baseline-report.json"))
          regressed = [f for f in ("open", "degraded", "unreplayable")
                       if report[f] > baseline[f]]
          if regressed:
              details = ", ".join(f"{f} {baseline[f]} -> {report[f]}" for f in regressed)
              print(f"::error::harness regression against the committed baseline: {details}")
              sys.exit(1)
          print("no regression against the committed baseline")
          PY
