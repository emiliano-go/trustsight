name: Mirror Integrity Check
on:
  push:
    branches: [master]
    paths:
      - "tests/fixtures/corpus.lock"
      - "scripts/build_corpus.py"
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # The corpus is not committed (*.diff is gitignored), so the lock is
      # the only durable description of it. Rebuilding from the lock is
      # itself the integrity check: if the AUR mirror has dropped a branch
      # or rewritten history, reconstruction fails here.
      - name: Reconstruct corpus from lock
        run: |
          python scripts/build_corpus.py --from-manifest \
            --manifest tests/fixtures/corpus.lock \
            --out tests/fixtures/benign-corpus

      - name: Verify corpus matches lock exactly
        shell: python
        run: |
          import json, sys
          from pathlib import Path

          corpus = Path("tests/fixtures/benign-corpus")
          lock = json.loads(Path("tests/fixtures/corpus.lock").read_text())
          entries = lock.get("entries", [])

          locked = {
              f"{e['pkg']}__{e['old_sha'][:12]}..{e['new_sha'][:12]}.diff"
              for e in entries
          }
          present = {p.name for p in corpus.rglob("*.diff")}

          errors = [f"MISSING: {n}" for n in sorted(locked - present)]
          errors += [f"ORPHAN: {n}" for n in sorted(present - locked)]

          if len(locked) != len(entries):
              errors.append(
                  f"DUPLICATE: lock has {len(entries)} entries but only "
                  f"{len(locked)} unique sha pairs"
              )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"All {len(entries)} lock entries verified OK")

      - name: Verify corpus hash matches baseline
        shell: python
        run: |
          import hashlib, json, sys
          from pathlib import Path

          h = hashlib.sha256()
          for dp in sorted(Path("tests/fixtures/benign-corpus").rglob("*.diff")):
              h.update(dp.read_bytes())
          actual = h.hexdigest()

          expected = json.loads(
              Path("tests/fixtures/baseline.json").read_text()
          )["corpus_content_sha256"]

          if actual != expected:
              print(f"Corpus content hash drifted.\n  baseline.json: {expected}\n  rebuilt:       {actual}")
              sys.exit(1)
          print(f"Corpus content hash matches baseline: {actual}")

      - name: Alert on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'The weekly mirror integrity check failed.',
              '',
              'The vendored corpus could not be reconstructed from',
              '`tests/fixtures/corpus.lock`, or the rebuilt corpus no longer',
              'matches `corpus_content_sha256` in `tests/fixtures/baseline.json`.',
              '',
              'Reproduce locally:',
              '',
              '```',
              'python scripts/build_corpus.py --from-manifest \\',
              '  --manifest tests/fixtures/corpus.lock \\',
              '  --out tests/fixtures/benign-corpus',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const title = 'Mirror integrity check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mirror-integrity',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue already open, not filing a duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['mirror-integrity'],
            });
