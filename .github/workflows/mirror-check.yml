name: Mirror Integrity Check
on:
  push:
    branches: [master]
    paths:
      - "tests/fixtures/corpus.lock"
      - "scripts/build_corpus.py"
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install
        run: uv sync --locked --extra dev --python 3.12

      # The corpus is not committed (*.diff is gitignored), so the lock is
      # the only durable description of it. Rebuilding from the lock is
      # itself the integrity check: if the AUR mirror has dropped a branch
      # or rewritten history, reconstruction fails here.
      - name: Reconstruct corpus from lock
        run: |
          uv run python scripts/build_corpus.py --from-manifest \
            --manifest tests/fixtures/corpus.lock \
            --out tests/fixtures/benign-corpus

      - name: Verify corpus matches lock exactly
        shell: python
        run: |
          import json, sys
          from pathlib import Path

          corpus = Path("tests/fixtures/benign-corpus")
          lock = json.loads(Path("tests/fixtures/corpus.lock").read_text())
          entries = lock.get("entries", [])

          locked = {
              f"{e['pkg']}__{e['old_sha'][:12]}..{e['new_sha'][:12]}.diff"
              for e in entries
          }
          present = {p.name for p in corpus.rglob("*.diff")}

          errors = [f"MISSING: {n}" for n in sorted(locked - present)]
          errors += [f"ORPHAN: {n}" for n in sorted(present - locked)]

          if len(locked) != len(entries):
              errors.append(
                  f"DUPLICATE: lock has {len(entries)} entries but only "
                  f"{len(locked)} unique sha pairs"
              )

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"All {len(entries)} lock entries verified OK")

      - name: Report corpus content hash
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          h = hashlib.sha256()
          for dp in sorted(Path("tests/fixtures/benign-corpus").rglob("*.diff")):
              h.update(dp.read_bytes())
          actual = h.hexdigest()

          expected = json.loads(
              Path("tests/fixtures/baseline.json").read_text()
          ).get("corpus_content_sha256")

          # Informational, never a gate.  The diffs are produced with
          # `git diff -W` and --xfuncname, whose hunk grouping is a
          # function of the git version, so two healthy reconstructions on
          # different runners do not necessarily produce byte-identical
          # diffs even for the same commits.  Failing here would be the
          # "old build, new runner" false alarm, not a mirror defect.
          # Mirror health is enforced by the MISSING/ORPHAN check and by
          # build_corpus aborting on an unreachable sha above.
          if expected and actual == expected:
              print(f"Corpus content hash matches baseline: {actual}")
          else:
              print(f"Corpus content hash (informational): {actual}")
              if expected:
                  print(f"  does not match baseline.json: {expected}")

      - name: Alert on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = [
              'The weekly mirror integrity check failed.',
              '',
              'The vendored corpus could not be reconstructed from',
              '`tests/fixtures/corpus.lock` (unreachable sha, empty diff,',
              'or MISSING/ORPHAN files), so the AUR mirror may have',
              'dropped a branch or rewritten history.',
              '',
              'Reproduce locally:',
              '',
              '```',
              'python scripts/build_corpus.py --from-manifest \\',
              '  --manifest tests/fixtures/corpus.lock \\',
              '  --out tests/fixtures/benign-corpus',
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const title = 'Mirror integrity check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'mirror-integrity',
            });
            if (existing.data.some(i => i.title === title)) {
              core.info('Issue already open, not filing a duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['mirror-integrity'],
            });
