name: PKGBUILD

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
    steps:
      # The container ships no git, so actions/checkout falls back to
      # downloading the source archive, which honours .gitattributes
      # export-ignore and therefore omits packaging/.  Install git first
      # to get a real checkout.
      - name: Install tooling
        run: pacman -Syu --noconfirm base-devel sudo git python gnupg

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build the deterministic release tarball
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkgver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          # The recorded checksum describes a version, not the branch tip.
          # Once v$pkgver is tagged the tag is immutable and is what the
          # checksum must describe; before that, the version is being
          # prepared and the checksum must describe this tree.
          if git rev-parse -q --verify "v${pkgver}" >/dev/null; then
            rev="v${pkgver}"
          else
            rev="WORKTREE"
          fi
          python scripts/build_release_tarball.py \
            --rev "$rev" \
            --pkgver "$pkgver" \
            --output "packaging/aur/trustsight-${pkgver}.tar.gz"

      - name: Prepare builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Verify the recorded checksum against the deterministic tarball
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/packaging/aur"
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          expected=$(python -c "import re,pathlib; print(re.search(r\"sha256sums=\(\s*'([0-9a-f]{64})'\", pathlib.Path('PKGBUILD').read_text()).group(1))")
          actual=$(sha256sum "trustsight-${pkgver}.tar.gz" | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "::error::PKGBUILD sha256sums ${expected} does not match deterministic tarball ${actual}"
            exit 1
          fi
          echo "Checksum matches: ${actual}"

      - name: Build and install from the release tarball
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/packaging/aur"
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          # No --nocheck: check() runs the shipped test suite from the
          # release archive, which is the build every user will do.
          if git -C "$GITHUB_WORKSPACE" rev-parse -q --verify "v${pkgver}" >/dev/null; then
            # A tagged version ships the signed tarball whose exact bytes the
            # committed `.sig` covers, so verify the signature the way a user
            # does.  The key is the public half only; CI can verify, not sign.
            su builder -c "gpg --batch --import '$GITHUB_WORKSPACE/scripts/commit_signing_key.asc'"
            su builder -c "cd '$PWD' && makepkg -si --noconfirm"
          else
            # Pre-release tree: the deterministic tarball moved since the
            # committed `.sig` was made, so the signature cannot verify here.
            # Checksums still do; the tagged path above verifies the
            # signature in full.
            su builder -c "cd '$PWD' && makepkg -si --skippgpcheck --noconfirm"
          fi

      - name: Verify installation
        run: trustsight --version
