name: PKGBUILD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install from PKGBUILD
        run: |
          pacman -Syu --noconfirm base-devel sudo git
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/packaging/aur"
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          git -C "$GITHUB_WORKSPACE" archive --prefix="trustsight-${pkgver}/" --format=tar.gz -o "trustsight-${pkgver}.tar.gz" HEAD
          su builder -c "cd '$PWD' && makepkg -si --noconfirm --skipchecksums --nocheck"
      - name: Verify installation
        run: trustsight --version
