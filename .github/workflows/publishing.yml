name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  classify:
    name: Classify release tag
    runs-on: ubuntu-latest
    outputs:
      is_software_release: ${{ steps.tag.outputs.is_software_release }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_software_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_software_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution
    needs: classify
    if: needs.classify.outputs.is_software_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [classify, build]
    if: needs.classify.outputs.is_software_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trustsight
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
