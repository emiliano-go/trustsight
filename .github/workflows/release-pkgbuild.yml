name: Update PKGBUILD on release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)generate the PKGBUILD for, e.g. v0.5.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-pkgbuild
  cancel-in-progress: false

# The checksum is written to the PKGBUILD on the default branch, never back
# onto the tag.  GitHub generates the source tarball from whatever tree the
# tag points at, so amending the tag would change the tarball and invalidate
# the checksum that had just been computed.  Leaving the tag fixed keeps the
# tarball, and therefore the checksum, stable forever.
#
# The PKGBUILD inside the tagged tarball still carries the previous release's
# checksum. That is harmless: nobody builds from the copy inside the tarball.
# Users clone the default branch, and the AUR gets its own copy.
#
# The work is split across two jobs on purpose.  Only makepkg needs Arch, and
# doing git work inside the container failed with "fatal: not in a git
# directory" even though actions/checkout had initialised the repository
# normally.  Generating metadata in the container and committing from the
# host runner keeps each tool where it is known to work.
jobs:
  build-metadata:
    name: Compute checksum and metadata
    runs-on: ubuntu-latest
    container: archlinux:latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      # git is required so that actions/checkout performs a real checkout:
      # the container's fallback downloads the source archive, which honours
      # .gitattributes export-ignore and therefore omits packaging/.
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Resolve tag
        id: tag
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Only the PKGBUILD is read here, so this checkout never needs to be a
      # usable git repository.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Compute checksum of the release tarball
        id: checksum
        run: |
          set -eu
          tag='${{ steps.tag.outputs.tag }}'
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          # The archive is generated on demand, so a fresh tag can 404 briefly.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o /tmp/source.tar.gz; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::${url} still unavailable after 5 attempts"
              exit 1
            fi
            sleep 10
          done
          sha256=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "Tarball sha256: ${sha256}"

      - name: Update PKGBUILD
        working-directory: packaging/aur
        run: |
          set -eu
          version='${{ steps.tag.outputs.version }}'
          sha256='${{ steps.checksum.outputs.sha256 }}'

          sed -i \
            -e "s/^pkgver=.*/pkgver=${version}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=(.*)$/sha256sums=('${sha256}')/" \
            PKGBUILD

          grep -q "^pkgver=${version}$" PKGBUILD
          grep -q "^sha256sums=('${sha256}')$" PKGBUILD

      - name: Verify the recorded checksum actually validates
        working-directory: packaging/aur
        run: |
          set -eu
          # makepkg refuses to run as root, and this is the step that would
          # catch a wrong checksum before it reaches a user.
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg --verifysource --noconfirm"

      - name: Regenerate .SRCINFO
        working-directory: packaging/aur
        run: |
          set -eu
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
          grep -q "pkgver = ${{ steps.tag.outputs.version }}" .SRCINFO

      - uses: actions/upload-artifact@v4
        with:
          name: pkgbuild-metadata
          path: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          # .SRCINFO is a dotfile, and upload-artifact skips hidden files
          # unless told otherwise.
          include-hidden-files: true
          if-no-files-found: error

  commit:
    name: Commit to the default branch
    needs: build-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: pkgbuild-metadata
          path: packaging/aur

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD packaging/aur/.SRCINFO
          if git diff --cached --quiet; then
            echo "PKGBUILD already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "packaging: set checksum for ${{ needs.build-metadata.outputs.tag }}

          Generated from the ${{ needs.build-metadata.outputs.tag }} source
          tarball by .github/workflows/release-pkgbuild.yml."
          git push origin HEAD:${{ github.event.repository.default_branch }}
