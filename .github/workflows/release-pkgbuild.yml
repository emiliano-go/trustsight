name: Verify the release artifact

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to verify, e.g. v0.13.2"
        required: true

permissions:
  contents: read

concurrency:
  group: release-verify
  cancel-in-progress: false

# This workflow used to compute the source checksum after the tag and commit
# it back to the default branch, because GitHub's on-demand
# `/archive/refs/tags/` tarball cannot exist until the tag does.  That design
# had two faults and both reached users.
#
# The window: between the version-bump commit and the commit that repaired
# the checksum, the default branch advertised a new pkgver alongside the
# previous release's checksum.  Anyone building from the branch or the AUR in
# that interval got a mismatch.
#
# The dependency on repair: the commit job needed the build job, so any
# failure upstream of it left the branch in that broken state permanently.
# In v0.13.1 that is exactly what happened, and the mismatch was reported by
# a user rather than caught here.
#
# The release tarball is now built by scripts/build_release_tarball.py, which
# is deterministic and depends only on the paths and contents git archive
# selects.  packaging/ is export-ignored, so writing the checksum into the
# PKGBUILD cannot change the tarball that checksum describes.  The checksum
# is therefore known before the tag exists and ships in the same commit as
# the version bump, and the artifact is uploaded to the release rather than
# generated on demand by GitHub.
#
# Nothing here writes to the repository.  This workflow only proves that what
# was published matches what the PKGBUILD claims.
jobs:
  classify:
    name: Classify release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      is_software_release: ${{ steps.tag.outputs.is_software_release }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_software_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_software_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify the published tarball
    needs: classify
    if: needs.classify.outputs.is_software_release == 'true'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git is required so that actions/checkout performs a real checkout:
      # the container's fallback downloads the source archive, which honours
      # .gitattributes export-ignore and therefore omits packaging/.
      - name: Install tooling
        run: pacman -Syu --noconfirm --needed base-devel git python

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.tag }}
          fetch-depth: 0

      - name: Rebuild the tarball from the tag
        id: rebuild
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sha=$(python scripts/build_release_tarball.py \
                  --rev "${{ needs.classify.outputs.tag }}" --print-sha256)
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"
          echo "Rebuilt tarball sha256: ${sha}"

      # The point of the whole design: the recorded checksum was committed
      # before the tag, so this can be asserted immediately and never needs
      # a repair commit.
      - name: The PKGBUILD must already record that checksum
        run: |
          set -eu
          recorded=$(sed -n "s/^sha256sums=('\(.*\)')$/\1/p" packaging/aur/PKGBUILD)
          rebuilt='${{ steps.rebuild.outputs.sha256 }}'
          if [ "$recorded" != "$rebuilt" ]; then
            echo "::error::PKGBUILD records ${recorded} but the tag rebuilds to ${rebuilt}"
            exit 1
          fi
          echo "PKGBUILD matches the tag: ${recorded}"

      - name: The published asset must be those exact bytes
        run: |
          set -eu
          version='${{ needs.classify.outputs.version }}'
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ needs.classify.outputs.tag }}/trustsight-${version}.tar.gz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o /tmp/asset.tar.gz; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::${url} is not downloadable; was the tarball attached to the release?"
              exit 1
            fi
            sleep 10
          done
          actual=$(sha256sum /tmp/asset.tar.gz | cut -d' ' -f1)
          if [ "$actual" != '${{ steps.rebuild.outputs.sha256 }}' ]; then
            echo "::error::published asset is ${actual}, expected ${{ steps.rebuild.outputs.sha256 }}"
            exit 1
          fi
          echo "Published asset matches: ${actual}"

      - name: Build and install from the published tarball
        run: |
          set -eu
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/packaging/aur"
          # No --nocheck: check() runs the shipped test suite from the
          # release archive, which is the build every user will do.
          su builder -c "cd '$PWD' && makepkg -si --noconfirm"

      - name: Verify installation
        run: trustsight --version
