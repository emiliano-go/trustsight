name: Release tests

# The README/docs badge points here, not at `test.yml`, so it describes the
# last *release* rather than whatever is on master at the moment.  A release
# published with the default GITHUB_TOKEN does not fire the `release` trigger
# on its own, so `publishing.yml` dispatches this workflow on the tag too.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing software tag to test, e.g. v0.22.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  classify:
    name: Classify release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_software_release: ${{ steps.tag.outputs.is_software_release }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "is_software_release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_software_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_software_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.python }})
    needs: classify
    if: needs.classify.outputs.is_software_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.tag }}
          # `tests/test_pkgbuild.py` ties the PKGBUILD checksum to the tag
          # named by `pkgver`, so the checkout must carry the tags.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --extra dev python scripts/verify_fixtures.py
      - run: uv run --extra dev pytest tests/
