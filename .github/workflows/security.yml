name: Security Gates

# The security model on every push.  `docs/security.md` states what
# TrustSight guarantees while reading hostile input and what a verdict
# claims; this job is the other half of that document.  A failure here
# means a published guarantee has stopped being true, which is a release
# blocker in a way a failing unit test is not: the doc is the promise and
# the gates are the proof, and the last gate checks that the two still
# describe the same set.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked --extra dev --python 3.12

      - name: Run the security gates
        run: uv run python scripts/security_gates.py --json security-gates.json

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-gates
          path: security-gates.json
