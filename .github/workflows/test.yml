name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --extra dev python scripts/verify_fixtures.py
      - run: uv run --extra dev pytest tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --extra dev ruff check

  # The docs build is a gate like any other: a nav entry that names a missing
  # page, or a page the LLM context file cannot reach, fails here rather than
  # reaching the published site.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra docs --python 3.13
      - run: uv run --extra docs zensical build
        env:
          # zensical_extensions is documentation tooling, not part of the
          # wheel: it lives in the checkout and is imported from there.
          PYTHONPATH: ${{ github.workspace }}
      - run: uv run --extra docs python scripts/build_llms_txt.py

  # The malicious .diff bodies are committed source (fixture-reproducibility
  # fallback). Regenerating them must be a no-op: if any generator drifts from
  # the committed record (the .diff bodies or the hand-reconciled expected.json
  # labels), this job fails and the drift must be fixed before the change can
  # land.
  fixture-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run python scripts/gen_historical_holdout_fixtures.py
      - run: uv run python scripts/gen_evasion_fixtures.py
      - run: uv run python scripts/gen_malicious_fixtures.py
      - run: uv run python scripts/gen_campaign_fixtures.py
      - run: uv run python scripts/gen_injection_fixtures.py
      - run: uv run python scripts/verify_fixtures.py
      - name: Fail if regeneration changed the committed record
        run: git diff --exit-code -- tests/fixtures/malicious/
