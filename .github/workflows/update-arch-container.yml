name: Update the Arch CI container digest

# `archlinux:latest` is a rolling image: it is rebuilt regularly, and each
# rebuild moves the digest the release workflows pin. Dependabot cannot
# update a `container:` image (dependabot-core #5819), so this job watches
# for the move.
#
# The digest lives in workflow files, and a `GITHUB_TOKEN` cannot push a
# change to one; the critical-path policy also requires the change to carry
# the pinned signature. Both mean the bump is a maintainer action, so this
# job opens (or refreshes) an issue with the exact commands instead of
# pushing an unsigned branch that could never land.

on:
  schedule:
    # Weekly. Arch rebuilds the image far more often, but the digest only
    # needs to move when the maintainer is ready to sign the change.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Open an issue if the pinned digest moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          current=$(grep -rhoE 'archlinux:latest@sha256:[0-9a-f]{64}' .github/workflows | sort -u)
          if [ "$(printf '%s\n' "$current" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one pinned Arch digest, found:"
            printf '  %s\n' "$current"
            exit 1
          fi
          latest="archlinux:latest@$(docker buildx imagetools inspect archlinux:latest --format '{{.Manifest.Digest}}')"
          if [ "$current" = "$latest" ]; then
            echo "digest is current: $current"
            exit 0
          fi
          echo "bumping ${current#archlinux:latest@} -> ${latest#archlinux:latest@}"

          title="ci: bump the pinned Arch container digest"
          body=$(cat <<EOF
          \`archlinux:latest\` was rebuilt.

          Pinned digest: \`${current#archlinux:latest@}\` -> \`${latest#archlinux:latest@}\`

          The digest lives in workflow files, which a \`GITHUB_TOKEN\` cannot
          push and the critical-path policy requires a signed commit to
          change. Land it with:

          \`\`\`bash
          for f in \$(grep -rlE 'archlinux:latest@sha256:[0-9a-f]{64}' .github/workflows); do
            sed -i "s|archlinux:latest@sha256:[0-9a-f]\{64\}|${latest}|g" "\$f"
          done
          git commit -am "ci: bump the pinned Arch container digest" -S
          \`\`\`
          EOF
          )
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
