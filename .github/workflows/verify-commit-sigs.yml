name: Verify commit signatures on critical paths

on:
  pull_request:
    branches:
      - master
  # Direct pushes to master bypassed this check entirely: it only ran on pull
  # requests, so 21 unsigned commits reached critical paths (db.py, the
  # PKGBUILD) without a signature. A push to master is the other way a commit
  # arrives, so it is checked too.
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check critical-path commit signatures
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          python - <<'PY'
          import ast
          import os
          import subprocess
          import sys
          import tempfile

          from scripts.critical_paths import CRITICAL_PATHS

          # The commit-signing trust anchor.  Both halves are in the
          # critical-path set, so changing the key or this fingerprint is
          # itself a signed change.  The key is imported into a throwaway
          # keyring and every commit is verified locally against it.  The
          # GitHub API's "verified" flag is deliberately not used: it accepts
          # a signature from any key GitHub has seen, not the pinned one.
          PINNED_FINGERPRINT = "F759D6D49B0A395AB922414A5CC3B4C50D37E793"
          KEY_FILE = "scripts/commit_signing_key.asc"

          base_sha = os.environ.get("PR_BASE_SHA") or os.environ.get("PUSH_BEFORE") or ""
          head_sha = os.environ.get("PR_HEAD_SHA") or os.environ.get("PUSH_AFTER") or ""

          if not head_sha or set(head_sha) == {"0"}:
              print("No commit range to check.")
              raise SystemExit(0)
          if not base_sha or set(base_sha) == {"0"}:
              # A first push or a force push with no usable base: check the
              # tip commit rather than every commit in history.
              base_sha = f"{head_sha}^"

          gnupg_home = tempfile.mkdtemp(prefix="trustsight-gnupg-")
          os.chmod(gnupg_home, 0o700)
          gpg_env = {**os.environ, "GNUPGHOME": gnupg_home}
          imported = subprocess.run(
              ["gpg", "--batch", "--import", KEY_FILE],
              env=gpg_env, capture_output=True, text=True,
          )
          if imported.returncode != 0:
              print(f"could not import {KEY_FILE}:\n{imported.stderr}")
              raise SystemExit(1)

          def signed_by_pinned_key(sha):
              """True only when *sha* carries a valid signature from the
              pinned key.  ``git verify-commit --raw`` writes the gpg status
              to stderr; VALIDSIG's second field is the signing key and its
              eleventh (when present) is the primary key."""
              result = subprocess.run(
                  ["git", "verify-commit", "--raw", sha],
                  env=gpg_env, capture_output=True, text=True,
              )
              for line in result.stderr.splitlines():
                  if line.startswith("[GNUPG:] VALIDSIG "):
                      parts = line.split()
                      signing = parts[2].upper()
                      primary = parts[10].upper() if len(parts) > 10 else signing
                      return PINNED_FINGERPRINT in (signing, primary)
              return False

          def critical_paths_at(rev):
              """The canonical list as of *rev*, not as of the change.

              Reading it from the checked-out tree let a pull request delete a
              path from the list and then modify that path without a
              signature, since the workflow would no longer consider it
              critical. The union of the base and the change closes that.
              """
              try:
                  source = subprocess.check_output(
                      ["git", "show", f"{rev}:scripts/critical_paths.py"], text=True
                  )
              except subprocess.CalledProcessError:
                  return set()
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name)
                      and target.id == "CRITICAL_PATHS"
                      for target in node.targets
                  ):
                      value = node.value
                      if (
                          isinstance(value, ast.Call)
                          and getattr(value.func, "id", "") == "frozenset"
                      ):
                          value = value.args[0]
                      return set(ast.literal_eval(value))
              return set()

          critical_paths = (
              critical_paths_at(base_sha)
              | critical_paths_at(head_sha)
              | set(CRITICAL_PATHS)
          )

          diff = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
              text=True,
          ).splitlines()
          touched = sorted(path for path in diff if path in critical_paths)
          if not touched:
              print("No critical paths touched; signature check skipped.")
              raise SystemExit(0)

          commits = subprocess.check_output(
              ["git", "rev-list", f"{base_sha}..{head_sha}"],
              text=True,
          ).splitlines()

          bad = []
          for sha in commits:
              if not signed_by_pinned_key(sha):
                  subject = subprocess.check_output(
                      ["git", "log", "-1", "--format=%s", sha], text=True
                  ).strip()
                  bad.append((sha, subject))

          if bad:
              print("ERROR: Critical-path changes require a signature from the "
                    f"pinned key {PINNED_FINGERPRINT}.")
              print("Touched critical paths:")
              for path in touched:
                  print(f"  {path}")
              print("Commits without a valid pinned signature:")
              for sha, subject in bad:
                  print(f"  {sha[:7]} {subject}")
              print("See CONTRIBUTING.md for setup steps.")
              raise SystemExit(1)

          print(f"All commits touching critical paths are signed by {PINNED_FINGERPRINT}.")
          PY
