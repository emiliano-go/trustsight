name: Verify commit signatures on critical paths

on:
  pull_request:
    branches:
      - master
  # Direct pushes to master bypassed this check entirely: it only ran on pull
  # requests, so 21 unsigned commits reached critical paths (db.py, the
  # PKGBUILD) without a signature. A push to master is the other way a commit
  # arrives, so it is checked too.
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check critical-path commit signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import subprocess
          import sys
          import urllib.request

          from scripts.critical_paths import CRITICAL_PATHS

          base_sha = os.environ.get("PR_BASE_SHA") or os.environ.get("PUSH_BEFORE") or ""
          head_sha = os.environ.get("PR_HEAD_SHA") or os.environ.get("PUSH_AFTER") or ""
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          if not head_sha or set(head_sha) == {"0"}:
              print("No commit range to check.")
              raise SystemExit(0)
          if not base_sha or set(base_sha) == {"0"}:
              # A first push or a force push with no usable base: check the
              # tip commit rather than every commit in history.
              base_sha = f"{head_sha}^"

          def critical_paths_at(rev):
              """The canonical list as of *rev*, not as of the change.

              Reading it from the checked-out tree let a pull request delete a
              path from the list and then modify that path without a
              signature, since the workflow would no longer consider it
              critical. The union of the base and the change closes that.
              """
              try:
                  source = subprocess.check_output(
                      ["git", "show", f"{rev}:scripts/critical_paths.py"], text=True
                  )
              except subprocess.CalledProcessError:
                  return set()
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name)
                      and target.id == "CRITICAL_PATHS"
                      for target in node.targets
                  ):
                      value = node.value
                      if (
                          isinstance(value, ast.Call)
                          and getattr(value.func, "id", "") == "frozenset"
                      ):
                          value = value.args[0]
                      return set(ast.literal_eval(value))
              return set()

          critical_paths = (
              critical_paths_at(base_sha)
              | critical_paths_at(head_sha)
              | set(CRITICAL_PATHS)
          )

          diff = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base_sha}...{head_sha}"],
              text=True,
          ).splitlines()
          touched = sorted(path for path in diff if path in critical_paths)
          if not touched:
              print("No critical paths touched; signature check skipped.")
              raise SystemExit(0)

          commits = subprocess.check_output(
              ["git", "rev-list", f"{base_sha}..{head_sha}"],
              text=True,
          ).splitlines()

          opener = urllib.request.build_opener()
          opener.addheaders = [
              ("Accept", "application/vnd.github+json"),
              ("Authorization", f"Bearer {token}"),
              ("X-GitHub-Api-Version", "2022-11-28"),
              ("User-Agent", "trustsight-signature-check"),
          ]

          bad = []
          for sha in commits:
              url = f"https://api.github.com/repos/{repo}/commits/{sha}"
              with opener.open(url) as response:
                  payload = json.load(response)
              verification = payload["commit"].get("verification") or {}
              signature = verification.get("signature") or ""
              verified = bool(verification.get("verified"))
              is_gpg = signature.startswith("-----BEGIN PGP SIGNATURE-----")
              if not verified or not is_gpg:
                  bad.append(
                      (
                          sha,
                          payload["commit"]["message"].splitlines()[0],
                          verification.get("reason", "unsigned"),
                          "GPG" if is_gpg else "non-GPG or missing signature",
                      )
                  )

          if bad:
              print("ERROR: Critical-path changes require GPG-signed commits.")
              print("Touched critical paths:")
              for path in touched:
                  print(f"  {path}")
              print("Unsigned or non-GPG commits:")
              for sha, subject, reason, detail in bad:
                  print(f"  {sha[:7]} {subject} ({reason}; {detail})")
              print("See CONTRIBUTING.md for setup steps.")
              raise SystemExit(1)

          print("All commits touching critical paths are GPG-signed.")
          PY
