# The AUR watcher as a long-lived container with a stable name and rotated
# logs:
#
#   docker compose -f docker-compose.watcher.yml up -d
#   docker compose -f docker-compose.watcher.yml logs -f trustsight-watch
#
# State (database, corpus snapshot, resume file) lives in the named volume, so
# a restart or a new image continues where the last cycle ended.  Mount a
# config directory carrying config.toml (and [notify] webhook) to keep settings
# out of the image; create it first if it does not exist:
#
#   mkdir -p trustsight-config
#
# The mount is writable because the watcher syncs `rules.toml` to the shipped
# ruleset once at startup, and writes any missing default config file.  A
# read-only mount makes that sync log `ruleset sync skipped: Permission denied`
# and keeps analysing with the rules the volume was created with.  The
# directory must be writable by the container's `ts` user (uid 1000).
#
services:
  trustsight-watch:
    image: ghcr.io/emiliano-go/trustsight:latest
    container_name: trustsight-watch
    command: ["full-aur", "--watch", "--interval", "1800"]
    restart: unless-stopped
    # A watcher is a long-lived service: let SIGTERM finish the package in
    # flight, save the resume state and checkpoint the WAL.
    init: true
    stop_grace_period: 2m
    # The image needs no root filesystem writes.  The data and config
    # volumes and the two tmpfs mounts are the only writable paths.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /home/ts/.cache:size=64m
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    # Re-fetch :latest on every `up`.  Docker keeps an existing :latest image
    # and will not re-pull the tag on its own, so without this a host silently
    # runs the version it first pulled, however far behind the channel moves.
    pull_policy: always
    volumes:
      - trustsight-data:/home/ts/.local/share/trustsight
      - ./trustsight-config:/home/ts/.config/trustsight
    environment:
      # Timestamp and level on every log line, so `docker logs` shows when a
      # cycle ran, not only what it did.
      TRUSTSIGHT_LOG_TIMESTAMPS: "1"
      TMPDIR: "/tmp"
      # A cycle parses and drops two ~360 MB metadata snapshots.  glibc keeps
      # the freed pages in per-thread arenas; capping arenas at 2 and trimming
      # at the top of the heap keeps RSS near the live set instead of the peak.
      # The watcher also calls malloc_trim(0) at the end of every cycle.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # Secret-file form of the feed key.  Prefer this (or a Docker secret)
      # over putting the private key in the environment, which is visible to
      # `docker inspect`.
      # TRUSTSIGHT_FEED_KEY_ID: "k1"
      # TRUSTSIGHT_FEED_KEY_FILE: "/run/secrets/trustsight_feed_key"
      # TRUSTSIGHT_LOG_LEVEL: "INFO"
      # TRUSTSIGHT_OFFLINE: "1"
      # The signed feed sink: the watcher POSTs every alert here as well as to
      # ntfy, so the feed ingests directly instead of polling.  The key is the
      # Ed25519 private key (base64 PKCS#8); the feed holds only the public
      # half.  With no key the feed sink is skipped.
      # TRUSTSIGHT_FEED_URL: "https://watcher.trustsight.org/api/ingest"
      # TRUSTSIGHT_FEED_KEY_ID: "k1"
      # TRUSTSIGHT_FEED_KEY: "<base64 pkcs8 ed25519>"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/trustsight", "full-aur", "health", "--optional"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  trustsight-data:
