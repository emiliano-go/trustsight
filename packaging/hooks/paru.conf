# TrustSight gate for paru.
#
# Merge this section into ~/.config/paru/paru.conf.  paru runs
# PreBuildCommand once per package base, with the working directory set to
# the checked-out PKGBUILD and PKGBASE/VERSION exported.  A non-zero exit
# aborts the whole transaction (paru has no per-package drop here).
#
# The gate prompts on the controlling terminal, so it still works when
# paru's output is piped or run from a timer.  Unattended runs fail closed;
# approve them explicitly with --yes or TRUSTSIGHT_GATE_DISABLE=1.

[bin]
PreBuildCommand = trustsight-gate --base "$PKGBASE" --dir "$PWD"
