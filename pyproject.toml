[project]
name = "trustsight"
version = "0.28.5"
description = "Security analysis and intelligence platform for the AUR ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Emiliano Gandini Outeda", email = "e@emiliano-go.com" }
]
license = "MIT"
keywords = ["aur", "arch-linux", "security", "vetting", "pkgbuild"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Archiving :: Packaging",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    # The floor is the release that bundles libgit2 >= 1.9.7.  Earlier
    # libgit2 trusts a sender-controlled delta result size and can allocate
    # gigabytes from a sub-kilobyte pack while cloning a malicious
    # repository (GHSA-27m5-gxxh-x79j / CVE-2026-53585), and 1.9.0-1.9.6
    # also carry the libssh2 remote-path command injection
    # (CVE-2026-5917).  1.20.0 bundles the affected 1.9.6; 1.20.1 bundles
    # the fixed 1.9.7.
    "pygit2>=1.20.1",
    "tldextract>=5.0",
    "rich>=13.0",
    "typer>=0.12",
    # Typer 0.29 imports its pydantic-backed adapters lazily when a typed
    # parameter is coerced, so a packaged CLI fails at the first command
    # without it.  Declared here so a resolver cannot pick typer without it.
    "pydantic>=2.0",
    # Ed25519 signature verification for baseline and seed imports (A13).
    # The floor is the release that made Ed25519 non-provisional; the module
    # that enforces a trust boundary should not resolve to anything older.
    "cryptography>=42.0",
    # YAML is a dependency-manifest syntax (pnpm-lock, pixi, conda, pubspec,
    # and peers). It is a hostile-input parser reading package-controlled
    # bytes, so only `yaml.safe_load` is used and the byte cap applies.
    "pyyaml>=6.0",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
    # Property-based parser tests: the locked corpus proves
    # equivalence; Hypothesis explores the contract itself.
    "hypothesis",
    "pytest-xdist>=3.8.0",
]
docs = [
    # Pinned to the versions in uv.lock.  The docs site is also built by an
    # external service that runs `pip install -e '.[docs]'` and does not read
    # the lock, so an unpinned range let it resolve a different zensical than
    # CI and shipped builds.
    "seoslug==2.3.0",
    "zensical==0.0.51",
]

[project.urls]
Homepage = "https://github.com/emiliano-go/trustsight"
Documentation = "https://docs.trustsight.org/"
Repository = "https://github.com/emiliano-go/trustsight"
Issues = "https://github.com/emiliano-go/trustsight/issues"
Changelog = "https://docs.trustsight.org/changelog/"

[project.scripts]
trustsight = "trustsight.cli:entrypoint"
trustsight-gate = "trustsight.gate:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustsight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A curated security/bug subset on top of the default E/F rules.  The
# project already runs Bandit-style checks in review; these are the ones
# that must not regress silently in the core.
extend-select = ["B", "S", "ASYNC", "DTZ"]
ignore = [
    # Typer.Option/Argument defaults are the framework idiom, not a call at
    # import time with hidden state.
    "B008",
    # Reviewed closures: each is invoked inside the same loop iteration.
    "B023",
    # Exception chaining is style here; callers match on the exception type.
    "B904",
    # zip() truncation is deliberate where the two sides can differ.
    "B905",
    # Asserts are the test/calibration harness, never runtime validation in src.
    "S101",
    # exec only in the release script that evaluates its own tagged sources.
    "S102",
    # Bind-all-interfaces is a gate fixture, not a listener in the product.
    "S104",
    # "/tmpfiles.d/" is a path string, not a temp-file creation.
    "S108",
    # Cleanup-only catches and retry loops that skip one item, reviewed.
    "S110",
    "S112",
    # urlopen targets are fixed AUR/GitHub hosts or operator-pinned feeds.
    "S310",
    # random is retry jitter, never a security decision.
    "S311",
    # Manifest XML refuses entity declarations and bounds input/depth.
    "S314",
    # subprocess runs without a shell and with parameterised argv.
    "S603",
    # The CLI intentionally resolves git/pacman through PATH.
    "S607",
    # SQL identifiers are internal constants; values are bound parameters.
    "S608",
]
[tool.ruff.lint.per-file-ignores]
# E402 is deliberate where a module must build or patch state before importing
# its dependencies: the CLI app registers command modules after constructing
# the Typer app, and tests put `src` on sys.path before importing trustsight.
"scripts/calibration_gates.py" = ["E402"]
"scripts/security_gates.py" = ["E402"]
# The api and manifests facades re-export names beyond their public __all__.
"src/trustsight/api/__init__.py" = ["F401"]
"src/trustsight/analysis/manifests/__init__.py" = ["F401"]
"src/trustsight/cli/app.py" = ["E402"]
"tests/test_api.py" = ["E402"]
"tests/test_inspect_history.py" = ["E402"]
"tests/test_pack_calibration_corpus.py" = ["E402"]
# Tests assert on pytest.raises(Exception) for a broad failure boundary.
"tests/**" = ["B017", "S105", "S106", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ~7k tests; the corpus-heavy files dominate a serial run.  Four workers
# with file grouping keep module-scoped fixtures and process-wide state
# isolated.  `-n 0` restores serial order for debugging.  Capped rather than
# `auto`: the regex-safety audit uses a wall-clock budget, and an
# oversubscribed machine makes a safe pattern time out.
addopts = "-n 4 --dist loadfile"
