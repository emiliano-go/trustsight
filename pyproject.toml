[project]
name = "trustsight"
version = "0.16.0"
description = "CLI-based AUR package update vetting tool"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Emiliano Gandini Outeda", email = "emiliano.gandini@protonmail.com" }
]
license = "MIT"
keywords = ["aur", "arch-linux", "security", "vetting", "pkgbuild"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Archiving :: Packaging",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pygit2>=1.14",
    "tldextract>=5.0",
    "rich>=13.0",
    "typer>=0.12",
    # Ed25519 signature verification for baseline and seed imports (A13).
    # The floor is the release that made Ed25519 non-provisional; the module
    # that enforces a trust boundary should not resolve to anything older.
    "cryptography>=42.0",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
docs = [
    "seoslug>=2.0.1",
    "zensical>=0.0.44",
]

[project.urls]
Documentation = "https://github.com/emiliano-go/trustsight"

[project.scripts]
trustsight = "trustsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustsight", "zensical_extensions"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# E402 is deliberate where a module must build or patch state before importing
# its dependencies: the CLI app registers command modules after constructing
# the Typer app, and tests put `src` on sys.path before importing trustsight.
"scripts/calibration_gates.py" = ["E402"]
"src/trustsight/cli/app.py" = ["E402"]
"tests/test_api.py" = ["E402"]
"tests/test_inspect_history.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
