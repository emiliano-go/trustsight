  "tests/test_manifest_worker.py::test_the_tokenizer_runs_in_the_content_worker",
]

[[machine]]
id = "worker-degradation"
title = "Sandbox degradation latch"
kind = "latch"
status = "implicit"
risk = "high"
summary = "A one-way per-process list of protections the worker could not apply. It is reported on every response so the parent can surface weaker isolation."
states = "no degradation recorded, one or more protections recorded"
anchors = [
  "trustsight.sandbox.git_worker:_DEGRADED",
  "trustsight.sandbox.git_worker:_apply_limits",
  "trustsight.sandbox.git_worker:_harden_libgit2",
]
tests = [
  "tests/test_git_os_sandbox.py::test_the_worker_refuses_to_start_with_a_vulnerable_libgit2",
  "tests/test_git_os_sandbox.py::test_the_bundled_libgit2_version_floor_is_enforced",
]

[[machine]]
id = "git-session"
title = "Git session lifecycle"
kind = "orchestration"
status = "implicit"
risk = "medium"
summary = "A session is created, live, then closed exactly once; close is idempotent, and process exit drains every live session."
