[[machine]]
id = "dependency-bfs"
title = "Dependency BFS and graph closure"
kind = "orchestration"
status = "implicit"
risk = "medium"
summary = "A bounded level-by-level frontier walk; truncation caused by a ceiling is a declared gap, while a finite depth ending by its own limit is a complete answer."
