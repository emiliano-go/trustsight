  "tests/test_depth.py::test_a_finite_depth_cut_by_the_ceiling_is_reported_truncated",
]

[[machine]]
id = "sandbox-worker"
title = "Sandbox worker lifecycle"
kind = "orchestration"
status = "implicit"
risk = "high"
summary = "A worker is absent, starting, ready, busy, retired after its request cap, or stopped after a timeout or invalid reply. A dead worker is a named refusal, never a silent pass."
states = "absent, starting, ready, busy, retired, stopped/failed"
anchors = [
  "trustsight.sandbox.manifest_client:_Worker",
  "trustsight.sandbox.manifest_client:_get_worker",
  "trustsight.sandbox.manifest_client:_close",
]
