anchors = [
  "trustsight.sandbox.git_client:GitSession",
  "trustsight.sandbox.git_client:GitSession.close",
]
tests = [
  "tests/test_git_client.py::test_a_closed_session_refuses",
  "tests/test_git_client.py::test_a_timed_out_request_closes_the_session",
]

