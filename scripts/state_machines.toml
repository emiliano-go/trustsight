  { module = "trustsight.db._schema", table = "alert_outbox", columns = ["attempts", "next_attempt_at", "ntfy_delivered", "feed_delivered", "parked_at", "last_error"], require = ["CHECK (attempts >= 0)", "CHECK (ntfy_delivered IN (0, 1))"] },
]

