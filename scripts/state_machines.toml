  "trustsight.db._lifecycles:AlertOutboxState.parked",
  "trustsight.db._lifecycles:AlertOutboxState.delivered",
  "trustsight.db._outbox:enqueue_alert_payload",
  "trustsight.db._outbox:pending_alert_payloads",
  "trustsight.db._outbox:mark_alert_sink",
  "trustsight.db._outbox:mark_alert_attempt",
  "trustsight.notify:flush_outbox",
]
tests = [
  "tests/test_lifecycle_states.py::test_outbox_parked_is_terminal",
  "tests/test_lifecycle_states.py::test_outbox_rows_follow_the_state_type",
  "tests/test_lifecycle_states.py::test_outbox_parks_at_max_attempts",
  "tests/test_schema.py::test_outbox_parked_state_is_terminal_in_sql",
]
