# The machines behind "State and lifecycles".
#
# Every entry is checked against the code by
# ``gate_state_machines_are_documented``: anchors must resolve, every
# ``tests`` node id must exist, and every table/column named under
# ``schema`` must appear in the schema module.  The generated inventory in
# docs/explanation/state-and-lifecycles.md is rendered from this file, so a
# renamed symbol or a removed column fails the build until the page and the
# registry follow.
#
# ``[[exempt]]`` lists the modules the inventory scanner classified and the
# page deliberately does not narrate: single-pass scanners, memos and
# one-way latches with no multi-state lifecycle.  A new module that trips
# the scanner is not exempt by default; it fails the gate until it is either
# documented above or classified here with a reason.

[[machine]]
id = "quote-state"
title = "Shell quote and heredoc state"
kind = "lexical"
status = "implicit"
risk = "high"
summary = "The quote-frame stack and heredoc FIFO decide what text is code, data or a heredoc body before any rule runs."
states = "code, single, double, ANSI-C, backtick, command substitution; heredoc delimiter queue"
anchors = [
  "trustsight.line_lex:QuoteState",
  "trustsight.line_lex:advance_quote_state",
  "trustsight.line_lex:lex_lines",
  "trustsight._heredoc:parse_opener",
  "trustsight._heredoc:_delimiter_word",
]
tests = [
  "tests/test_machine_contracts.py::test_quote_state_carries_across_lines",
  "tests/test_machine_contracts.py::test_a_truncated_line_resets_quote_state",
  "tests/test_machine_contracts.py::test_heredoc_openers_are_a_fifo_queue",
]

[[machine]]
id = "diff-parser"
title = "Unified-diff parser"
kind = "document"
status = "implicit"
risk = "high"
summary = "One walk turns raw diff lines into files, hunks and classified lines with file attribution and both line numbers."
states = "no current file, in file, in hunk; pending old path, pending hunk boundary, pending file metadata"
anchors = [
  "trustsight.diffdoc:parse_diff_lines",
  "trustsight.diffdoc:_parse_diff_lines_cached",
]
tests = [
  "tests/test_machine_contracts.py::test_diffdoc_classifies_every_input_line",
  "tests/test_diffdoc.py::test_in_hunk_survives_a_file_header_legacy_compat",
]

[[machine]]
id = "recipe-segmentation"
title = "Recipe function segmentation"
kind = "document"
status = "implicit"
risk = "medium"
summary = "Bash function bodies are segmented by brace depth; a redefinition keeps the last body."
states = "outside a function, opener seen, body open at depth > 0, closed"
anchors = [
  "trustsight.recipedoc:_function_segments",
  "trustsight.recipedoc:parse_recipe",
]
tests = [
  "tests/test_recipedoc.py::test_one_line_body_stays_closed",
  "tests/test_recipedoc.py::test_brace_on_a_later_line_opens_the_body",
]

[[machine]]
id = "fetch-trust"
title = "Fetch trust state"
kind = "persisted"
status = "explicit"
